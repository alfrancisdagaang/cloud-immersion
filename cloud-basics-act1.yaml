AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stratpoint Cloud Basics Activity 1 - VPC with public/private subnets,
  a t2.micro EC2 instance reachable via SSH from one IP, an S3 bucket, and an
  IAM role/instance profile granting the instance access to that bucket.

Parameters:
  MyIp:
    Type: String
    Description: Your current public IPv4 address (no mask). /32 is added automatically.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
    ConstraintDescription: Must be a valid IPv4 address (each part 0-255) such as 203.0.113.10
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: Daga-ang-KeyPair-Act1
    Description: Existing EC2 key pair used for SSH.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved at deploy time.

Resources:
  # ---------------- Networking ----------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: Daga-ang-VPC-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: Daga-ang-InternetGateway-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: Daga-ang-PublicSubnet-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: Daga-ang-PrivateSubnet-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: Daga-ang-PublicRouteTable-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Private subnet: its own route table, local routing only (no NAT Gateway, by design)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: Daga-ang-PrivateRouteTable-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ---------------- Security ----------------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from my public IP only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${MyIp}/32"
          Description: SSH from my current public IP
      Tags:
        - { Key: Name, Value: Daga-ang-SecurityGroup-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  # ---------------- Storage ----------------
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "daga-ang-bucket-act1-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: Name, Value: Daga-ang-S3Bucket-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  # ---------------- IAM ----------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Daga-ang-BucketAccess-Act1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt S3Bucket.Arn
              - Sid: ObjectReadWriteDelete
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${S3Bucket.Arn}/*"
      Tags:
        - { Key: Name, Value: Daga-ang-IAMRole-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

  # AWS::IAM::InstanceProfile has no Tags property in CloudFormation (not taggable).
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ---------------- Compute ----------------
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required # enforce IMDSv2
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet
          GroupSet:
            - !Ref SecurityGroup
      Tags:
        - { Key: Name, Value: Daga-ang-EC2Instance-Act1 }
        - { Key: ProjectCode, Value: CloudBasics-Act1-CloudIntern }

Outputs:
  VpcId:
    Value: !Ref VPC
  InstanceId:
    Value: !Ref EC2Instance
  InstancePublicIp:
    Value: !GetAtt EC2Instance.PublicIp
  SshCommand:
    Description: Connect from PowerShell
    Value: !Sub "ssh -i C:\\Users\\user\\.ssh\\Daga-ang-KeyPair-Act1.pem ec2-user@${EC2Instance.PublicIp}"
  BucketName:
    Value: !Ref S3Bucket
